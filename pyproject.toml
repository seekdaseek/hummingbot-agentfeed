[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hummingbot-agentfeed"
version = "0.1.1"
description = "AgentFeed cross-venue liquidation pressure as a Hummingbot liquidations feed source"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["bidict"]

[tool.setuptools]
packages = ["hummingbot_agentfeed"]
